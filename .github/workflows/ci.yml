name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Requires-live-service integration tests (postgres/neo4j) are marked
      # #[ignore]; the default run covers memory/json storage, mock-based
      # neo4j tests and the embedded tantivy backend.
      - name: Run tests
        run: cargo test --workspace

  webui:
    name: WebUI (lint & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easyrag-webui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: easyrag-webui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
