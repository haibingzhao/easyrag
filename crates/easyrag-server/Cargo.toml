[package]
name = "easyrag-server"
description = "HTTP/SSE server for EasyRAG: axum routes, DTOs, SSE streaming, Ollama-compatible endpoints"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
easyrag-core = { workspace = true }
easyrag-pipeline = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
mime = { workspace = true }
mime_guess = { workspace = true }
jsonwebtoken = { workspace = true }
bcrypt = { workspace = true }
moka = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

# Optional MCP server stack (enabled by the `mcp` feature only).
rmcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[features]
# Model Context Protocol server: a Streamable HTTP (stateless) endpoint that
# mirrors the REST capabilities easyai consumes. Default-off so the base build
# and CI never compile rmcp; the release binary opts in via easyrag-app.
mcp = ["dep:rmcp", "dep:schemars"]

[dev-dependencies]
easyrag-storage = { workspace = true }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
tempfile = { workspace = true }
tokio-test = "0.4"
